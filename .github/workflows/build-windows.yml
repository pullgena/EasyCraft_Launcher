name: Release v0.4.15 Windows EXE + Auto Update

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    # v와 0을 붙인 정확한 태그 v0.4.15에서만 정식 빌드합니다.
    if: ${{ github.event.release.tag_name == 'v0.4.15' }}
    runs-on: windows-latest

    steps:
      - name: Checkout v0.4.15 source
        uses: actions/checkout@v6
        with:
          ref: v0.4.15
          fetch-depth: 0

      - name: Verify release tag and package version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if ($tag -ne "v0.4.15") {
            Write-Error "Release tag must be exactly v0.4.15"
            exit 1
          }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne "0.4.15") {
            Write-Error "package.json version must be exactly 0.4.15"
            exit 1
          }
          Write-Host "Release tag/version OK: $tag / $($pkg.version)"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run smoke checks
        run: npm run test:smoke

      # 먼저 로컬 dist에 EXE + blockmap + latest.yml을 확실하게 생성합니다.
      - name: Build Windows installer and updater files
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Verify auto-update release assets
        run: node scripts/verify-release-assets.js

      # 이미 사용자가 만든 v0.4.15 Release에 자동 업데이트 파일을 그대로 올립니다.
      # Release 본문(업데이트 내역)은 건드리지 않습니다.
      - name: Upload EXE and auto-update files to v0.4.15 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.4.15 `
            "dist/EasyCraft-Launcher-Setup-0.4.15.exe" `
            "dist/EasyCraft-Launcher-Setup-0.4.15.exe.blockmap" `
            "dist/latest.yml" `
            --clobber

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyCraft-Launcher-v0.4.15-Windows-AutoUpdate
          path: |
            dist/EasyCraft-Launcher-Setup-0.4.15.exe
            dist/EasyCraft-Launcher-Setup-0.4.15.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
