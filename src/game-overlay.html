<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:"Segoe UI","Malgun Gothic",sans-serif;user-select:none}
.badge{height:34px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border-radius:10px;background:rgba(9,13,12,.76);border:1px solid rgba(116,230,179,.28);box-shadow:0 5px 18px rgba(0,0,0,.24);color:#eefaf5;font-size:12px;font-weight:700;letter-spacing:-.01em;backdrop-filter:blur(8px)}
.dot{width:7px;height:7px;border-radius:50%;background:#63e1a7;box-shadow:0 0 12px rgba(99,225,167,.9)}
.brand{color:#8df0c2}
</style></head><body><div class="badge"><span class="dot"></span><span><span class="brand">EasyCraft Launcher</span>로 실행됨</span></div></body></html>
